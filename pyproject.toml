[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-gap-agent"
version = "0.1.0"
description = "Autonomous research-gap discovery agent over academic literature APIs"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "pypdf>=4",
    "openai>=1.50",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]
gui = ["streamlit>=1.40"]

[project.scripts]
research-gap-agent = "research_gap_agent.cli:main"

[tool.setuptools.packages.find]
include = ["research_gap_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
