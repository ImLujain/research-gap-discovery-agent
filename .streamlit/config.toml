# Theme. Both palettes are defined, so the app offers Light / Dark / System in the sidebar
# (Appearance) and in the ☰ menu under Settings.
[theme]
font = "sans serif"

[theme.light]
primaryColor = "#3A5F9F"
backgroundColor = "#E8E6E0"
secondaryBackgroundColor = "#F4F3EF"
textColor = "#232323"

[theme.dark]
primaryColor = "#8FAEDC"
backgroundColor = "#1B1B1B"
secondaryBackgroundColor = "#262626"
textColor = "#DDDDD9"

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
