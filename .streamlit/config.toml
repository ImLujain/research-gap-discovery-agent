# Theme. Both palettes are defined, so the app offers Light / Dark / System in the sidebar
# (Appearance) and in the ☰ menu under Settings.
[theme]
font = "sans serif"

[theme.light]
primaryColor = "#3B6FD6"
backgroundColor = "#F6F5F1"
secondaryBackgroundColor = "#EBEAE4"
textColor = "#2A2A2A"

[theme.dark]
primaryColor = "#7CA7F2"
backgroundColor = "#171717"
secondaryBackgroundColor = "#242424"
textColor = "#E3E3E0"

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
